apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "datachat.fullname" . }}
  labels:
    {{- include "datachat.labels" . | nindent 4 }}
data:
  LLM_PROVIDER: {{ .Values.env.llmProvider | quote }}
  OPENAI_MODEL: {{ .Values.env.openaiModel | quote }}
  OPENAI_BASE_URL: {{ .Values.env.openaiBaseUrl | quote }}
  {{- if .Values.env.postgresHost }}
  POSTGRES_HOST: {{ .Values.env.postgresHost | quote }}
  POSTGRES_PORT: {{ .Values.env.postgresPort | quote }}
  POSTGRES_DATABASE: {{ .Values.env.postgresDatabase | quote }}
  POSTGRES_USER: {{ .Values.env.postgresUser | quote }}
  {{- end }}
