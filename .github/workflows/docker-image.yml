name: Docker Image CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Tagged Docker release to Google Artifact Registry

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - uses: actions/checkout@v4

    - id: auth
      name: Authenticate with Google Cloud
      uses: google-github-actions/auth@v2
      with:
        token_format: access_token
        workload_identity_provider: projects/737383768001/locations/global/workloadIdentityPools/github-ilx-pool/providers/platform-app-ilx
        service_account: sa-artifact-registries@platform-app-ilx.iam.gserviceaccount.com
        access_token_lifetime: 300s

    - name: Login to Artifact Registry
      uses: docker/login-action@v2
      with:
        registry: europe-west3-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}

    - name: Build the Docker image
      run: |
        docker build -t europe-west3-docker.pkg.dev/platform-app-ilx/docker-image-repository/datachat:${{ github.sha }} .

    - name: docker push
      run: |
        docker push europe-west3-docker.pkg.dev/platform-app-ilx/docker-image-repository/datachat:${{ github.sha }}
